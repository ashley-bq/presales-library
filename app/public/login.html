<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>登录 · 售前汇报素材库</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/style.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; background: radial-gradient(circle at 80% 0%, rgba(245,184,0,.18), transparent 45%), var(--bg); }
    form { width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 32px 28px; display: grid; gap: 14px; }
    h1 { margin: 0 0 6px; font-size: 20px; display: flex; gap: 10px; align-items: center; }
    h1 i { width: 24px; height: 24px; border-radius: 6px; background: linear-gradient(135deg, var(--accent), #8a6a00); }
    .err { color: var(--red); min-height: 18px; font-size: 13px; }
  </style>
</head>
<body>
  <form id="f">
    <h1><i></i>售前汇报素材库</h1>
    <input class="input" name="username" placeholder="用户名" autocomplete="username" required autofocus>
    <input class="input" name="password" type="password" placeholder="密码" autocomplete="current-password" required>
    <div class="err" id="err"></div>
    <button class="btn primary" type="submit">登录</button>
    <div class="hint">没有账号请联系管理员开通</div>
  </form>
  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.fromEntries(fd)) });
      const j = await r.json().catch(() => ({}));
      if (r.ok) location.href = '/'; else document.getElementById('err').textContent = j.error || '登录失败';
    });
  </script>
</body>
</html>
